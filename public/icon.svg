<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Halo Gradient -->
    <radialGradient id="bgHalo" cx="50%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#FF5FA2" stop-opacity="0.32" />
      <stop offset="38%" stop-color="#221226" stop-opacity="0.94" />
      <stop offset="75%" stop-color="#140D17" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#0E0A0D" stop-opacity="1" />
    </radialGradient>

    <!-- Glossy Pink Letter Gradient -->
    <linearGradient id="pinkGlossy" x1="0%" y1="0%" x2="25%" y2="100%">
      <stop offset="0%" stop-color="#FFF5FA" />
      <stop offset="25%" stop-color="#FFD1E5" />
      <stop offset="65%" stop-color="#FF8FC0" />
      <stop offset="100%" stop-color="#FF5FA2" />
    </linearGradient>

    <!-- Subtitle Pink Gradient -->
    <linearGradient id="subPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF8FC0" />
      <stop offset="50%" stop-color="#FFD1E5" />
      <stop offset="100%" stop-color="#FF8FC0" />
    </linearGradient>

    <!-- Star Sparkle Gradient -->
    <linearGradient id="sparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FFD1E5" />
      <stop offset="100%" stop-color="#FF5FA2" />
    </linearGradient>

    <!-- Top Gloss Reflex Overlay -->
    <linearGradient id="topGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14" />
      <stop offset="38%" stop-color="#FFFFFF" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- 1. Base Card Shape with Deep Dark & Halo Background -->
  <rect width="512" height="512" rx="116" fill="url(#bgHalo)" />

  <!-- 2. Glossy Reflex Top Sheen -->
  <rect width="512" height="256" rx="116" fill="url(#topGloss)" />

  <!-- 3. Outer Borders (subtle pink tinted glow & glassy rim) -->
  <rect x="10" y="10" width="492" height="492" rx="108" fill="none" stroke="#FF5FA2" stroke-width="2.5" stroke-opacity="0.25" />
  <rect x="20" y="20" width="472" height="472" rx="98" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- 4. Inner Luxury Dashed Ring -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="#FF8FC0" stroke-width="1.8" stroke-opacity="0.25" stroke-dasharray="8 6" />

  <!-- 5. Top Star Sparkle (Luxury Vintage Jewel) -->
  <path d="M 256 86 Q 256 102 242 110 Q 256 118 256 134 Q 256 118 270 110 Q 256 102 256 86 Z" fill="url(#sparkle)" />
  <circle cx="256" cy="110" r="2.5" fill="#FFFFFF" />

